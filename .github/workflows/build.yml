name: Build SQL (DacPac)
on:
  workflow_dispatch:

jobs:
  
  build:
    
    runs-on: self-hosted

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Cache NuGet Packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.sqlproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget

      - name: Restore
        run: dotnet restore ForgeDB.slnx

      - name: Build
        run: dotnet build ForgeDB.slnx --configuration Release --no-restore

      # - name: Install SqlPackage
      #   uses: microsoft/sqlpackage-action@v2

      - name: Generate Deployment Script
        shell: powershell
        run: |
          $dacpac = Get-ChildItem "${{ github.workspace }}" -Recurse -Filter *.dacpac | Select-Object -First 1
          
          sqlpackage `
            /Action:Script `
            /SourceFile:"$($dacpac.FullName)" `
            /TargetConnectionString:"${{ secrets.DB_CONNECTION_STRING }}" `
            /OutputPath:"Deploy.sql"
          
      - name: Generate Deploy Report
        shell: powershell
        run: |
          $dacpac = Get-ChildItem "${{ github.workspace }}" -Recurse -Filter *.dacpac | Select-Object -First 1
          
          sqlpackage `
            /Action:DeployReport `
            /SourceFile:"$($dacpac.FullName)" `
            /SourceConnectionString:"${{ secrets.DB_CONNECTION_STRING }}" `
            /OutputPath:"DriftReport.xml"

      - name: Upload Deployment Script
        uses: actions/upload-artifact@v4
        with:
          name: deploy-script
          path: Deploy.sql

      - name: Upload Drift Report
        uses: actions/upload-artifact@v4
        with:
          name: drift-report
          path: DriftReport.xml

      - name: Upload DACPAC
        uses: actions/upload-artifact@v4
        with:
          name: dacpac
          path: '**/*.dacpac'
